[workspace]
resolver = "2"
members = [
  "latch-smart-account",
  "latch-account-factory/contracts/factory-contract",
  "latch-account-factory/contracts/dummy-account",
  "latch-account-factory/contracts/dummy-singleton",
  "latch-threshold-policy",
  "latch-verifiers/ed25519-phantom-verifier",
  "latch-verifiers/secp256k1-verifier",
  "latch-verifiers/webauthn-verifier",
  "session-policy",
  "spending-limit-policy",
]

[workspace.dependencies]
soroban-sdk = "26.1.0"
stellar-accounts = "=0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
