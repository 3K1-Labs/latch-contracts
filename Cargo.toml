[workspace]
resolver = "2"
members = [
  "latch-smart-account",
  "account-factory/contracts/factory-contract",
  "account-factory/contracts/dummy-account",
  "account-factory/contracts/dummy-singleton",
  "latch-verifiers/ed25519-verifier",
  "latch-verifiers/webauthn-verifier",
  "policies/threshold-policy",
  "policies/weighted-threshold-policy",
  "policies/session-policy",
  "policies/parameter-scoped-policy",
  "policies/spending-limit-policy",
  "policies/multi-token-spending-limit-policy",
  "policies/recipient-allowlist-policy",
  "demo/modified-ed25519-verifier",
]

[workspace.dependencies]
soroban-sdk = "26.1.0"
stellar-accounts = "=0.7.2"
stellar-contract-utils = "=0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
