name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Computed once and shared by every job below. This is a required status
  # check target for some workflows, so it must always report — the jobs
  # below skip their heavy steps on a docs-only change, but still run and
  # report success, so a required check never sits at "Expected — waiting
  # for status to be reported".
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '!**/*.md'

  # A single Cargo workspace now covers every crate, so `cargo fmt --all`
  # checks all of them in one pass regardless of working directory — running
  # it once here instead of inside every matrix entry below avoids checking
  # the whole workspace redundantly N times.
  fmt:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: needs.changes.outputs.code == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check format (whole workspace)
        if: needs.changes.outputs.code == 'true'
        run: cargo +nightly fmt --all -- --check

  # Computes the current workspace member list straight from `Cargo.toml` via
  # `cargo metadata`, so `build-and-test`'s matrix always covers every crate
  # actually in the workspace. Adding a crate to `[workspace] members` is
  # already mandatory for it to build at all — this makes that the *only*
  # thing required for CI to pick it up too, instead of also requiring a
  # separately hand-maintained matrix list that's easy to forget (as PRs #50
  # and #56 did — both added a crate to the workspace without adding a
  # matrix entry, so neither crate's build/test/clippy ever ran in CI; #50's
  # crate turned out to not even compile, entirely undetected as a result).
  discover-workspace:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      workspace_dirs: ${{ steps.list.outputs.workspace_dirs }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: List workspace member directories
        id: list
        run: |
          dirs=$(cargo metadata --no-deps --format-version 1 \
            | jq -c --arg root "$PWD/" '[.packages[].manifest_path | sub("^" + $root; "") | sub("/Cargo.toml$"; "")]')
          echo "workspace_dirs=$dirs" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: [changes, discover-workspace]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.discover-workspace.outputs.workspace_dirs) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: needs.changes.outputs.code == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Check clippy (${{ matrix.workspace }})
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: ${{ matrix.workspace }}

      - name: Build (${{ matrix.workspace }})
        if: needs.changes.outputs.code == 'true'
        run: cargo build --verbose
        working-directory: ${{ matrix.workspace }}

      - name: Test (${{ matrix.workspace }})
        if: needs.changes.outputs.code == 'true'
        run: cargo test --verbose
        working-directory: ${{ matrix.workspace }}
