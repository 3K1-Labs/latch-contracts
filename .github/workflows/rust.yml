name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Computed once and shared by every job below. This is a required status
  # check target for some workflows, so it must always report — the jobs
  # below skip their heavy steps on a docs-only change, but still run and
  # report success, so a required check never sits at "Expected — waiting
  # for status to be reported".
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '!**/*.md'

  # A single Cargo workspace now covers every crate, so `cargo fmt --all`
  # checks all of them in one pass regardless of working directory — running
  # it once here instead of inside every matrix entry below avoids checking
  # the whole workspace redundantly N times.
  fmt:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: needs.changes.outputs.code == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check format (whole workspace)
        if: needs.changes.outputs.code == 'true'
        run: cargo +nightly fmt --all -- --check

  build-and-test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - latch-smart-account
          - account-factory/contracts/factory-contract
          - account-factory/contracts/dummy-account
          - account-factory/contracts/dummy-singleton
          - latch-threshold-policy
          - latch-verifiers/ed25519-phantom-verifier
          - latch-verifiers/secp256k1-verifier
          - latch-verifiers/webauthn-verifier
          - session-policy
          - spending-limit-policy

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: needs.changes.outputs.code == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Check clippy (${{ matrix.workspace }})
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: ${{ matrix.workspace }}

      - name: Build (${{ matrix.workspace }})
        if: needs.changes.outputs.code == 'true'
        run: cargo build --verbose
        working-directory: ${{ matrix.workspace }}

      - name: Test (${{ matrix.workspace }})
        if: needs.changes.outputs.code == 'true'
        run: cargo test --verbose
        working-directory: ${{ matrix.workspace }}
